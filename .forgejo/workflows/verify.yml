name: forgejo-verify

on:
  push:
    branches: [v2]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: forgejo-wall-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Forgejo / Wall required
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '(#')
    runs-on: skwd-wall-next-ci
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_PANIC: unwind
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      SKWD_RUNNER_IMAGE: sha256:66058d5c15a5011188ee634bb909d730c279ab0d65408581b5d70e99a6970edb
      SKWD_VERIFY_ROOT: ../skwd-verify
    defaults:
      run:
        working-directory: suite/skwd-wall
    steps:
      - name: Check out Wall
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: suite/skwd-wall
          persist-credentials: false

      - name: Check out Deck contracts
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: liixini/skwd-deck
          ref: b716489a01684546d09d2295b74ad366f4231cb9
          path: suite/skwd-deck
          token: ${{ secrets.SKWD_SUITE_READ_TOKEN }}
          persist-credentials: false

      - name: Check out Lens contracts
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: liixini/skwd-lens
          ref: b4d993418a348cf0d455b3c41b3cbfe6e31060e1
          path: suite/skwd-lens
          token: ${{ secrets.SKWD_SUITE_READ_TOKEN }}
          persist-credentials: false

      - name: Check out system verifier
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: liixini/skwd-verify
          ref: 3c7ce77170ee148fda7a2b6661099aa8b699bcb9
          path: suite/skwd-verify
          token: ${{ secrets.SKWD_SUITE_READ_TOKEN }}
          persist-credentials: false

      - name: Verify toolchain and isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.94.1"
          test ! -S /var/run/docker.sock
          test ! -S /run/docker.sock
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Restore Cargo download cache
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: wall-cargo-${{ github.event_name }}-rust-1.94.1-${{ hashFiles('suite/skwd-wall/Cargo.lock') }}
          restore-keys: |
            wall-cargo-${{ github.event_name }}-rust-1.94.1-

      - name: Create result directory
        run: mkdir -p ci-artifacts/results

      - name: Verify system-test repository
        working-directory: suite/skwd-verify
        continue-on-error: true
        run: >-
          python3 scripts/ci-report.py wrap
          --suite verify.repository --target linux-x86_64
          --expect-skips 0 --out ../skwd-wall/ci-artifacts/results/verify-repository.json
          -- scripts/test-all.sh

      - name: Format
        continue-on-error: true
        run: python3 "$SKWD_VERIFY_ROOT/scripts/ci-report.py" wrap --suite wall.format --target linux-x86_64 --expect-skips 0 --out ci-artifacts/results/wall-format.json -- cargo fmt --check

      - name: Python tests
        continue-on-error: true
        run: python3 "$SKWD_VERIFY_ROOT/scripts/ci-report.py" wrap --suite wall.python --target linux-x86_64 --expect-skips 0 --out ci-artifacts/results/wall-python.json -- env PYTHONDONTWRITEBYTECODE=1 python3 "$SKWD_VERIFY_ROOT/scripts/python_suite.py"

      - name: Unsafe inventory
        continue-on-error: true
        run: python3 "$SKWD_VERIFY_ROOT/scripts/ci-report.py" wrap --suite wall.unsafe --target linux-x86_64 --expect-skips 0 --out ci-artifacts/results/wall-unsafe.json -- "$SKWD_VERIFY_ROOT/scripts/check-unsafe-code.sh"

      - name: Clippy
        id: clippy
        continue-on-error: true
        run: python3 "$SKWD_VERIFY_ROOT/scripts/ci-report.py" wrap --suite wall.clippy --target linux-x86_64 --expect-skips 0 --out ci-artifacts/results/wall-clippy.json -- cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        id: tests
        if: steps.clippy.outcome == 'success'
        continue-on-error: true
        run: python3 "$SKWD_VERIFY_ROOT/scripts/ci-report.py" wrap --suite wall.tests --target linux-x86_64 --expect-skips 2 --out ci-artifacts/results/wall-tests.json -- cargo test --locked --release --features obs-heap -- --skip alloc_free

      - name: Allocation guards
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: python3 "$SKWD_VERIFY_ROOT/scripts/ci-report.py" wrap --suite wall.allocations --target linux-x86_64 --expect-skips 0 --out ci-artifacts/results/wall-allocations.json -- cargo test --locked --release --features obs-heap --bin skwd-wall alloc_free -- --test-threads=1

      - name: Release build
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: python3 "$SKWD_VERIFY_ROOT/scripts/ci-report.py" wrap --suite wall.release --target linux-x86_64 --expect-skips 0 --out ci-artifacts/results/wall-release.json -- cargo build --locked --release --package skwd-wall --bin skwd-wall

      - name: Record blocked suites
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          present=$(jq -r .suite ci-artifacts/results/*.json)
          grep -v '^#' scripts/ci-required-manifest.txt | sed '/^[[:space:]]*$/d' | while read -r suite; do
            if ! printf '%s\n' "$present" | grep -qx -- "$suite"; then
              python3 "$SKWD_VERIFY_ROOT/scripts/ci-report.py" emit --suite "$suite" --target linux-x86_64 --ok false --detail 'BLOCKED: an earlier required gate failed' --out "ci-artifacts/results/$(printf '%s' "$suite" | tr . -).json"
            fi
          done

      - name: Record exact execution provenance
        if: always()
        run: python3 "$SKWD_VERIFY_ROOT/scripts/ci-provenance.py" --out ci-artifacts/provenance.json --runner-image "$SKWD_RUNNER_IMAGE" --toolchains

      - name: Aggregate required results
        if: always()
        run: python3 "$SKWD_VERIFY_ROOT/scripts/ci-report.py" aggregate --dir ci-artifacts/results --manifest scripts/ci-required-manifest.txt --strict-extra

      - name: Retain reports and provenance
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: wall-required-${{ github.sha }}
          path: suite/skwd-wall/ci-artifacts
          if-no-files-found: error
          retention-days: 14
